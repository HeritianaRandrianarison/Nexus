name: Build NEXUS Android Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP if present
        run: |
          if [ -f "NEXUS-android-sprint1.zip" ]; then
            unzip -o NEXUS-android-sprint1.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Run unit tests & build Debug APK
        run: |
          if [ -d "NEXUS" ]; then cd NEXUS; fi
          gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p dist-apk
          cp "$(find . -name 'app-debug.apk' | head -n 1)" dist-apk/NEXUS-sprint1-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-sprint1-debug-apk
          path: dist-apk/NEXUS-sprint1-debug.apk
